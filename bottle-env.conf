# ARC Raiders — bottle settings
#
# One "KEY = value" per line. Lines starting with # are OFF — remove the # to turn on.
# Inline comments after a value are allowed:  WINEMSYNC = 1 # try MSync
# Save the file and start Launch ARC Raiders.command.

# --- Recommended (tested on M5 Pro) -------------------------------------------

WINEMSYNC = 0                                   # thread sync: 0 = classic (stable)
CX_GRAPHICS_BACKEND = d3dmetal                   # render backend: d3dmetal / dxmt / wine
D3DM_ENABLE_METALFX = 0                          # MetalFX upscaling: 0 / 1
DXMT_ENABLE_NVEXT = 0                            # NV extensions, only for dxmt

# --- Experiments: remove the # in front of a line to enable it ---------------

# WINEMSYNC = 1                                 # try MSync (may give more FPS)

# CX_GRAPHICS_BACKEND = dxmt                    # DXMT backend
# DXMT_ENABLE_NVEXT = 1                         # goes together with dxmt

# D3DM_ENABLE_METALFX = 1                       # enable MetalFX
