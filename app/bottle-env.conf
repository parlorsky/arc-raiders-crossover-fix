# ARC Raiders — bottle settings
#
# One "KEY = value" per line.
# Lines starting with # are turned OFF — just remove the # to turn an option on.
# Save the file and start Launch ARC Raiders.command.

# --- Recommended (tested on M5 Pro) ------------------------------------------

WINEMSYNC = 0
CX_GRAPHICS_BACKEND = d3dmetal
D3DM_ENABLE_METALFX = 0
DXMT_ENABLE_NVEXT = 0

